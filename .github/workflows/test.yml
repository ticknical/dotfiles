name: Test

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2.0.0

    - name: Run make and check output
      run: |
        make

    - name: Deploy dotfiles via symlinks
      run: make deploy

    - name: Check zsh config files load without errors
      run: |
        for f in .zsh/*.zsh; do
          echo "==> sourcing $f"
          output=$(zsh -c "source $f" 2>&1)
          if [ -n "$output" ]; then
            echo "$output"
            exit 1
          fi
        done
